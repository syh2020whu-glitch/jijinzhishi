<style>
    @font-face {
        font-family: "JFSeal";

    }
    html, body { margin: 0; height: 100%; background: #16130f; color: #ede3cf; overflow: hidden;
        font-family: "Noto Serif TC", "Source Han Serif TC", serif; -webkit-tap-highlight-color: transparent; }

    #back { left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); }

    #reticle { display: none; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
        border: 1.5px solid rgba(244,213,138,.7); box-shadow: 0 0 6px rgba(244,213,138,.5); }
    #reticle::after { content: ''; position: absolute; inset: 2px; border-radius: 50%; background: #f4d58a; transform: scale(var(--p, 0)); transition: transform .08s linear; }
    #caption { position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(92vw, 640px);
        text-align: center; background: rgba(22,19,15,.55); border: 1px solid rgba(244,213,138,.22); padding: 10px 16px; backdrop-filter: blur(6px); }
    #caption .big { font-size: 22px; letter-spacing: .2em; color: #f4d58a; }

    body.gazing #reticle { display: block; }

    body.stereo #hud .corner, body.stereo #caption, body.stereo #reticle { display: none !important; }
    #stereoExit { position: fixed; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 12; display: none;
        background: rgba(22,19,15,.5); border: 1px solid rgba(244,213,138,.35); color: #f4d58a; font-size: 12px; letter-spacing: .2em; padding: 6px 12px; }
    body.stereo #stereoExit { display: block; }

<body>
<canvas id="c"></canvas>

<div id="gate">
    <h1>入尊讀銘</h1>

    <p class="desc">何尊的銘文鑄在器內底，博物館裡看不到。這一段約三分鐘：群星聚成何尊，你縮身沉入器中，十二行銘文從腳下升起，環繞四周。盯住一個字約一秒，會顯示隸定與今譯，有構擬讀音的字會念給你聽。</p>
    <div class="row" id="modes">

<script>
(async function () {
    'use strict';
    const Q = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    const isPhone = (navigator.maxTouchPoints || 0) > 1 && Math.min(screen.width || 0, screen.height || 0) <= 920;

    // ---------- 桌面模擬頭顯（?xrsim=1）----------
    if (Q.has('xrsim') && window.IWER) {
        try {
            const dev = new IWER.XRDevice(IWER.metaQuest3);
            dev.installRuntime({ forceInstall: true });   // 桌面 Chrome 自帶 navigator.xr 但沒設備，強制用模擬器
            window.__xrDevice = dev;
        } catch (e) { console.warn('IWER 注入失敗', e); }
    }

    // ---------- 常量：場景沿用星河的「尊單位」（尊高 270），world 縮放到米 ----------
    const S_GALAXY = 0.010;   // 序幕：尊 2.7 m 高，立在前方 6 m
    const S_INSIDE = 0.030;   // 主體：尊 8.1 m 高，腹部半徑約 2.3 m
    const EYE_H = 1.2;        // 坐姿眼高（米）：器底在腳下 1.2 m
    const GOLD = [244, 213, 138];
    const periodColorMap = [
        { match: /商/,        color: [224, 150, 96] },
        { match: /西周/,      color: [232, 196, 124] },
        { match: /春秋/,      color: [240, 218, 168] },
        { match: /戰國|战国/, color: [222, 216, 200] },
    ];
    function periodColor(period) {
        for (const p of periodColorMap) if (p.match.test(period || '')) return p.color;
        return [200, 176, 128];
    }

    // ---------- 尊的旋成體輪廓（與 index.html 一致）----------
    const ZUN = {
        body: [
            { y:   0, r:  60 }, { y:  14, r:  54 }, { y:  28, r:  52 },
            { y:  42, r:  58 }, { y:  62, r:  70 }, { y:  88, r:  76 },
            { y: 112, r:  78 }, { y: 136, r:  74 }, { y: 158, r:  64 },
            { y: 178, r:  58 }, { y: 198, r:  62 }, { y: 218, r:  74 },
            { y: 238, r:  86 }, { y: 254, r:  95 }, { y: 270, r: 100 },
        ],
        yRange: [0, 270],
    };
    function sampleProfile(profile, y) {
        if (y <= profile[0].y) return profile[0].r;
        for (let i = 1; i < profile.length; i++) {
            if (y <= profile[i].y) {
                const t = (y - profile[i - 1].y) / (profile[i].y - profile[i - 1].y);
                const s = t * t * (3 - 2 * t);
                return profile[i - 1].r * (1 - s) + profile[i].r * s;
            }
        }
        return profile[profile.length - 1].r;
    }
    function buildCDF(profile, yMin, yMax, N) {
        N = N || 512;
        const ys = new Float32Array(N), rs = new Float32Array(N), cum = new Float32Array(N);
        let acc = 0;
        for (let i = 0; i < N; i++) {
            const y = yMin + (yMax - yMin) * (i / (N - 1));
            const r = sampleProfile(profile, y);
            acc += r; ys[i] = y; rs[i] = r; cum[i] = acc;
        }
        const total = cum[N - 1] || 1;
        for (let i = 0; i < N; i++) cum[i] /= total;
        return { ys, rs, cum, N };
    }
    function cdfSample(cdf, u) {
        let lo = 0, hi = cdf.N - 1;
        while (lo < hi) { const m = (lo + hi) >> 1; if (cdf.cum[m] < u) lo = m + 1; else hi = m; }
        return { y: cdf.ys[lo], r: cdf.rs[lo] };
    }
    const ZUN_CDF = buildCDF(ZUN.body, 0, 270);
    function flangeExtra(y) { const t = y / 270; return 7 + 13 * t * t + 2.5 * Math.abs(Math.sin(y * 0.11)); }
    function shape_zun(i, total, rand) {
        const flangeN = Math.floor(total * 0.20), rimN = Math.floor(total * 0.14), footN = Math.floor(total * 0.07);
        if (i < flangeN) {
            const y = rand[0] * 270;
            const theta = (i % 4) * (Math.PI / 2) + (rand[1] - 0.5) * 0.06;
            const r = sampleProfile(ZUN.body, y) + flangeExtra(y) + (rand[2] - 0.5) * 1.4;
            return [r * Math.cos(theta), y, r * Math.sin(theta)];
        }
        if (i < flangeN + rimN) {
            const theta = rand[0] * Math.PI * 2, y = 256 + rand[1] * 14;
            const r = 70 + (100 - 70) * Math.sqrt(rand[2]);
            return [r * Math.cos(theta), y, r * Math.sin(theta)];
        }
        if (i < flangeN + rimN + footN) {
            const theta = rand[0] * Math.PI * 2, y = rand[1] * 16;
            const r = sampleProfile(ZUN.body, y) + (rand[2] - 0.5) * 2;
            return [r * Math.cos(theta), y, r * Math.sin(theta)];
        }
        const { y, r } = cdfSample(ZUN_CDF, rand[0]);
        const theta = rand[1] * Math.PI * 2;
        return [(r + (rand[3] - 0.5) * 1.5) * Math.cos(theta), y + (rand[2] - 0.5) * 1.5, (r + (rand[3] - 0.5) * 1.5) * Math.sin(theta)];
    }
    function shape_galaxy(i, total, rand) {
        const rMin = 18, rMax = 1180;
        const r = rMin + (rMax - rMin) * Math.sqrt(rand[0]);
        const arm = i % 4;
        const spiral = Math.log(Math.max(r, rMin + 1) / rMin) * 1.08;
        const onArm = rand[3] < 0.7;
        const theta = onArm ? arm * (Math.PI / 2) + spiral + (rand[1] - 0.5) * 0.42 : rand[1] * Math.PI * 2;
        const rr = r + (rand[4] - 0.5) * (onArm ? 40 : 16);
        return [rr * Math.cos(theta), (rand[2] - 0.5) * 5, rr * Math.sin(theta)];
    }
    // 尾聲：穹頂，半徑 330（×0.03 ≈ 10 m），仰角 8°–88°
    function shape_dome(i, total, rand) {
        const R = 330;
        const el = (8 + 80 * Math.sqrt(rand[0])) * Math.PI / 180;
        const az = rand[1] * Math.PI * 2;
        return [R * Math.cos(el) * Math.cos(az), 40 + R * Math.sin(el), R * Math.cos(el) * Math.sin(az)];
    }

    // ---------- 渲染器 / 相機 ----------
    const canvas = $('c');
    let renderer;
    try {
        const probe = document.createElement('canvas');
        if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('no webgl');
        renderer = new THREE.WebGLRenderer({ canvas, antialias: !isPhone, alpha: false, powerPreference: 'high-performance' });
    } catch (e) {
        $('gate').innerHTML = '<h1>入尊讀銘</h1><p class="desc">此設備不支持 WebGL，無法繪製。請改用 Chrome / Edge。</p><a href="demo.html">← 回吉金智識</a>';
        return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isPhone ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x16130f, 1);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');   // 頭在原點；眼高由 world.position.y 決定，坐著看也對

    const scene = new THREE.Scene();
    const rig = new THREE.Group();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 150);
    camera.position.set(0, 0, 0.01);
    rig.add(camera);
    scene.add(rig);
    const world = new THREE.Group();
    world.scale.setScalar(S_GALAXY);
    world.position.set(0, -EYE_H, -6);
    scene.add(world);

    // 深空星塵（不衰減的小點，米制空間裡 20–50 m）
    {
        const N = 1500, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) {
            const r = 20 + Math.random() * 30, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
            pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th); pos[i * 3 + 2] = r * Math.cos(ph);
            const c = Math.random() < 0.6 ? [0.79, 0.63, 0.36] : [0.92, 0.83, 0.63];
            col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        g.setAttribute('color', new THREE.BufferAttribute(col, 3));
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false })));
    }
    // 器內底：暗銅色圓盤 + 一圈微光
    const floor = new THREE.Group();
    floor.add(new THREE.Mesh(new THREE.CircleBufferGeometry(60, 48), new THREE.MeshBasicMaterial({ color: 0x241c13 })));
    floor.add(new THREE.Mesh(new THREE.RingBufferGeometry(56, 60, 64), new THREE.MeshBasicMaterial({ color: 0x6b5324, transparent: true, opacity: 0.8 })));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.5;
    floor.visible = false;
    world.add(floor);

    // ---------- 圖集：1690 字做成每張圖集一個 InstancedMesh（7 個 draw call，雙目 14 個）----------
    function loadImage(src) {
        return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('load fail ' + src)); im.src = src; });
    }
    const atlasMeta = await (await fetch('./assets/atlas/glyphs.json')).json();
    const charIndex = await (await fetch('./jinwen_svg/index.json')).json();
    const sheetImgs = await Promise.all(Array.from({ length: atlasMeta.sheets }, (_, i) => loadImage(`./assets/atlas/glyphs-${i}.png`)));
    const sheetTex = sheetImgs.map(img => {
        let src = img;
        if (isPhone) {   // 手機：2048² → 1024²，省 3/4 顯存
            const cv = document.createElement('canvas'); cv.width = cv.height = 1024;
            cv.getContext('2d').drawImage(img, 0, 0, 1024, 1024); src = cv;
        }
        const t = new THREE.Texture(src);
        t.format = THREE.AlphaFormat;
        t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
        t.generateMipmaps = true; t.needsUpdate = true;
        return t;
    });
    const COLS = atlasMeta.cols, ROWS = Math.ceil(atlasMeta.count / atlasMeta.sheets / COLS) ;
    const cellUV = new THREE.Vector2(1 / COLS, atlasMeta.cell * 1 / (sheetImgs[0].height));   // 行數按真實圖高算
    const cloudVert = `
        attribute vec3 offset; attribute vec2 uvo; attribute vec3 tint; attribute float scl;
        uniform vec2 cellUV; uniform float gscale;
        varying vec2 vUv; varying vec3 vTint;
        void main() {
            vUv = uvo + uv * cellUV;
            vTint = tint;
            vec3 right = normalize(vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]));
            vec3 up    = normalize(vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]));
            float ms = length(modelMatrix[0].xyz);
            vec3 wp = (modelMatrix * vec4(offset, 1.0)).xyz + (right * position.x + up * position.y) * scl * gscale * ms;
            gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        }`;
    const cloudFrag = `
        uniform sampler2D map; uniform float opacity;
        varying vec2 vUv; varying vec3 vTint;
        void main() {
            float a = texture2D(map, vUv).a;
            if (a < 0.03) discard;
            gl_FragColor = vec4(vTint, a * opacity);
        }`;
    const chars = Object.keys(atlasMeta.chars);
    const total = chars.length;
    const rands = chars.map(() => [Math.random(), Math.random(), Math.random(), Math.random(), Math.random()]);
    const bySheet = Array.from({ length: atlasMeta.sheets }, () => []);
    chars.forEach((ch, i) => bySheet[atlasMeta.chars[ch][0]].push(i));
    const cloudGroup = new THREE.Group();
    world.add(cloudGroup);
    const cloud = { meshes: [], from: new Float32Array(total * 3), to: new Float32Array(total * 3), cur: new Float32Array(total * 3),
        delay: new Float32Array(total), t0: 0, dur: 1, active: false, opacity: 1 };
    const slotOf = new Int32Array(total);   // 全局 i → (mesh, 實例序號)
    const meshOfChar = new Int32Array(total);
    bySheet.forEach((idxs, s) => {
        const n = idxs.length;
        const geo = new THREE.InstancedBufferGeometry();
        const quad = new THREE.PlaneBufferGeometry(1, 1);
        geo.setIndex(quad.getIndex()); geo.setAttribute('position', quad.getAttribute('position')); geo.setAttribute('uv', quad.getAttribute('uv'));
        const offset = new Float32Array(n * 3), uvo = new Float32Array(n * 2), tint = new Float32Array(n * 3), scl = new Float32Array(n);
        idxs.forEach((gi, k) => {
            const slot = atlasMeta.chars[chars[gi]];
            uvo[k * 2] = slot[1] / COLS; uvo[k * 2 + 1] = 1 - (slot[2] + 1) * cellUV.y;
            const c = periodColor((charIndex[chars[gi]] || {}).period);
            tint[k * 3] = c[0] / 255; tint[k * 3 + 1] = c[1] / 255; tint[k * 3 + 2] = c[2] / 255;
            scl[k] = 12 + rands[gi][4] * 8;
            slotOf[gi] = k; meshOfChar[gi] = s;
        });
        geo.setAttribute('offset', new THREE.InstancedBufferAttribute(offset, 3).setUsage(THREE.DynamicDrawUsage));
        geo.setAttribute('uvo', new THREE.InstancedBufferAttribute(uvo, 2));
        geo.setAttribute('tint', new THREE.InstancedBufferAttribute(tint, 3));
        geo.setAttribute('scl', new THREE.InstancedBufferAttribute(scl, 1));
        const mat = new THREE.ShaderMaterial({
            uniforms: { map: { value: sheetTex[s] }, cellUV: { value: cellUV }, gscale: { value: 1 }, opacity: { value: 1 } },
            vertexShader: cloudVert, fragmentShader: cloudFrag, transparent: true, depthWrite: false, depthTest: true,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.frustumCulled = false;
        cloudGroup.add(mesh);
        cloud.meshes.push(mesh);
    });
    function cloudSet(shapeFn) {   // 立即就位
        for (let i = 0; i < total; i++) {
            const p = shapeFn(i, total, rands[i]);
            cloud.cur[i * 3] = p[0]; cloud.cur[i * 3 + 1] = p[1]; cloud.cur[i * 3 + 2] = p[2];
        }
        cloud.active = false;
        cloudPush();
    }
    function cloudGo(shapeFn, dur, stagger) {   // 從當前位置飛向新形態，按序號錯峰出發
        cloud.from.set(cloud.cur);

        if (gyro) return true;
        try {
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                const r = await DeviceOrientationEvent.requestPermission();   // iOS 13+：必須在點擊裡
                if (r !== 'granted') { toast('沒有拿到方向感應器權限，改用拖動環視。'); return false; }
            }
            gyro = new THREE.DeviceOrientationControls(camera);
            return true;
        } catch (e) { console.warn('gyro', e); toast('這台設備拿不到陀螺儀，改用拖動環視。'); return false; }
    }
    function setMode(m) {
        mode = m;
        orbit.enabled = (m === 'flat');
        if (gyro) gyro.enabled = (m === 'gyro');
        if (m === 'flat') { camera.position.set(0, 0, 0.01); orbit.update(); }
        if (m === 'gyro') camera.position.set(0, 0, 0);
        document.body.classList.toggle('xr', m === 'xr');
    }
    $('btnFlat').onclick = () => { unlockAudio(); setMode('flat'); start(); };
    $('btnGyro').onclick = async () => { unlockAudio(); if (await enableGyro()) setMode('gyro'); else setMode('flat'); start(); };
    $('btnStereo').onclick = async () => {
        unlockAudio();
        if (!(await enableGyro())) { setMode('flat'); start(); return; }
        setMode('gyro');
        if (!stereo) { stereo = new THREE.StereoEffect(renderer); stereo.setEyeSeparation(0.064); }
        stereoOn = true; document.body.classList.add('stereo');
        try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
        try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
        if (window.innerHeight > window.innerWidth) toast('請把手機橫過來，再放進 Cardboard。', 5000);
        start();
    };
    $('stereoExit').onclick = () => {
        stereoOn = false; document.body.classList.remove('stereo');
        try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
        onResize();
    };
    // WebXR：VRButton 自己檢測能力；進入後頭部位姿接管相機
    let modeBeforeXR = 'flat';
    const vrBtn = THREE.VRButton.createButton(renderer, {
        optionalFeatures: [],
        onStatus: (st) => {
            if (st === 'ready') $('modes').insertBefore(vrBtn, $('btnGyro'));
            else if (st === 'unsupported' && 'xr' in navigator) $('capNote').textContent += ' 這台設備沒有可用的 VR 顯示（安卓需裝好 Cardboard 支持；桌面瀏覽器可用拖動環視預覽）。';
            else if (st === 'error') toast('進入 VR 失敗，請確認已套上 Cardboard 或頭顯瀏覽器允許 VR。');
        },
    });
    renderer.xr.addEventListener('sessionstart', () => {
        modeBeforeXR = mode; unlockAudio();
        orbit.enabled = false; if (gyro) gyro.enabled = false;
        camera.position.set(0, 0, 0); camera.quaternion.identity();
        mode = 'xr'; document.body.classList.add('xr');
        $('gate').style.display = 'none';
        start();
    });
    renderer.xr.addEventListener('sessionend', () => {
        document.body.classList.remove('xr');
        setMode(modeBeforeXR === 'xr' ? 'flat' : modeBeforeXR);
        onResize();
    });
    if (Q.has('autostart')) { setMode('flat'); start(); }

    function onResize() {
        if (renderer.xr.isPresenting) return;
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (stereoOn && stereo) stereo.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 300));

    // ---------- 主循環 ----------
    renderer.setAnimationLoop(() => {
        const now = clockNow();
        const dt = clock.getDelta(); void dt;
        timelineTick(now);
        cloudTick();
        if (mode === 'flat') orbit.update();
        else if (mode === 'gyro' && gyro) gyro.update();
        gazeTick(now);
        hudModeTick();
        if (stereoOn && stereo && !renderer.xr.isPresenting) stereo.render(scene, camera);
        else renderer.render(scene, camera);
    });
    window.__vr = { start, nextPhase, setMode, enableGyro, get phase() { return phase; }, get mode() { return mode; }, get stereoOn() { return stereoOn; }, glyphs, world, camera, cloud, select, renderer };
})().catch(err => { console.error(err); const g = document.getElementById('gate'); if (g) g.insertAdjacentHTML('beforeend', '<p class="note" style="color:#faa">載入失敗：' + (err && err.message) + '</p>'); });
</script>
</body>
</html>
